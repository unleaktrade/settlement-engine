name: CI & Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:
    inputs:
      program:
        description: "Program to test"
        required: false
        type: string
        default: "settlement-engine"
      branch:
        description: "Branch to test"
        required: false
        type: string
        default: "*"

jobs:
  lint-and-unit:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile

      # Scoped to the script + unit-test sources this job covers; the legacy
      # tests/*.spec.ts files predate Prettier enforcement and are out of scope.
      - name: Prettier (scripts & unit tests)
        run: npx prettier "scripts/**/*.ts" "tests/unit/**/*.ts" --check

      - name: Unit tests (no validator)
        run: yarn test:unit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: solana-developers/github-actions/extract-versions@v0.2.5
        id: versions

      - uses: solana-developers/github-actions/setup-all@v0.2.5
        with:
          solana_version: ${{ steps.versions.outputs.solana_version }}
          anchor_version: ${{ steps.versions.outputs.anchor_version }}
          node_version: 20

      - uses: solana-developers/github-actions/run-tests@v0.2.5
        with:
          solana_version: ${{ steps.versions.outputs.solana_version }}
          anchor_version: ${{ steps.versions.outputs.anchor_version }}
          program: ${{ inputs.program }}
